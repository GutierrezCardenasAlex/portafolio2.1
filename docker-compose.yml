services:
  axissoft-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: axissoft-app
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      HOSTNAME: 0.0.0.0
      PORT: 3000
    expose:
      - "3000"

  nginx:
    image: nginx:1.27-alpine
    container_name: axissoft-nginx
    restart: unless-stopped
    depends_on:
      - axissoft-app
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
